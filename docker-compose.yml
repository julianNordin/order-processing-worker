# The local stack. One definition, used identically by a developer on their own machine and by CI,
# because the moment those two diverge "works on my machine" becomes possible again.
#
# Services are added to this file by the phase that first needs them: the broker here in Phase 04,
# Postgres in Phase 05, and the API and worker themselves in Phase 15.

name: orderprocessing

services:
  rabbitmq:
    image: rabbitmq:4.2.6-management
    container_name: orderprocessing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env - copy .env.example}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env - copy .env.example}
      # Without this the broker refuses to start once the disk drops below 50MB free, which on a
      # developer machine reads as an unexplained connection failure. 1GB is a threshold that means
      # something.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit disk_free_limit 1073741824"
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI - http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Two checks, because they fail differently. check_running says the Erlang application is up;
      # check_port_connectivity says it is actually accepting AMQP connections. Waiting only on
      # "container running" is the classic way to get a connection refused that looks like a bug in
      # your own code.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: orderprocessing-postgres
    environment:
      POSTGRES_DB: orderprocessing
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env - copy .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - copy .env.example}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 changed where the data directory should be mounted. Mounting at
      # /var/lib/postgresql/data - correct for 17 and earlier - makes the 18 image refuse to start,
      # because it wants to own the parent directory so that a future pg_upgrade --link can work
      # across the mount boundary. The container exits 1 with an explanation that is easy to miss.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # pg_isready is the only honest readiness signal here. The container reports "running" a
      # second or two before the server accepts connections, and that gap is long enough for a
      # service started alongside it to fail its first query and die.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d orderprocessing"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/OrderProcessing.Api/Dockerfile
    container_name: orderprocessing-api
    environment:
      # Every secret arrives from the environment. Nothing here is committed - the values come from
      # .env, which is gitignored, and in a deployed system they would come from a secret store.
      ConnectionStrings__OrderProcessing: "Host=postgres;Port=5432;Database=orderprocessing;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Production
      # Only the API migrates. Two services racing to apply the same migration is avoidable noise,
      # and one of them has to go first anyway.
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      # service_healthy, not service_started. Compose considers a container "started" the moment the
      # process exists, which for Postgres and RabbitMQ is many seconds before either accepts a
      # connection. Both services would survive that gap on their own - they retry - but the retries
      # would be the first thing anyone saw in the logs of a fresh `up`.
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: src/OrderProcessing.Worker/Dockerfile
    container_name: orderprocessing-worker
    environment:
      ConnectionStrings__OrderProcessing: "Host=postgres;Port=5432;Database=orderprocessing;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Long enough for the drain in StopAsync to finish before Docker escalates SIGTERM to SIGKILL.
    # The default is 10s; the drain is bounded at 15s, so the default would cut it short.
    stop_grace_period: 30s

volumes:
  rabbitmq-data:
  postgres-data:
