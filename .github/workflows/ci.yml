name: CI

# Every push and every pull request. A gate that only runs on one branch is a gate people learn to
# route around.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Nothing here is interactive, and the telemetry ping is one more thing that can be slow.
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          # No version here on purpose: global.json is the single source of truth for which SDK this
          # repository builds with, and naming it twice is how the two drift apart.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # Warnings are errors in Directory.Build.props, so this step is the style and analyser gate
        # as well as the compile.
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/OrderProcessing.UnitTests --no-build --configuration Release --verbosity normal

      - name: Integration tests
        # These start their own Postgres and RabbitMQ through Testcontainers. The hosted runner
        # already has a Docker daemon, so nothing else is needed - and crucially they run against the
        # same image tags as docker-compose.yml, so CI cannot pass against a different broker than a
        # developer uses.
        run: dotnet test tests/OrderProcessing.IntegrationTests --no-build --configuration Release --verbosity normal

  images:
    name: Build container images
    runs-on: ubuntu-latest
    # Only worth building images for something that already compiles and passes.
    needs: build-and-test

    strategy:
      matrix:
        # Two values per service, not one. The project name is PascalCase because that is what the
        # directory and the assembly are called; the image tag has to be lowercase because Docker
        # rejects an uppercase repository name outright. Deriving one from the other is not possible
        # here - Actions expressions have no lowercase function - so both are stated.
        include:
          - service: Api
            image: orderprocessing-api
          - service: Worker
            image: orderprocessing-worker

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/OrderProcessing.${{ matrix.service }}/Dockerfile
          # Built but not pushed. There is no registry to push to, and a CI job that publishes
          # artefacts nobody consumes is a job that eventually breaks unnoticed. Building proves the
          # Dockerfile still works, which is the thing that actually rots.
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it runs as a non-root user
        run: |
          user=$(docker run --rm --entrypoint sh ${{ matrix.image }}:ci -c 'id -un')
          echo "image runs as: $user"
          if [ "$user" = "root" ]; then
            echo "::error::The image runs as root."
            exit 1
          fi

  compose:
    name: Whole stack from a clean slate
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Start the stack
        # The claim in the README is "clone it and run docker compose up". This job is what stops
        # that claim quietly becoming false.
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180

      - name: Place an order and download its receipt
        run: |
          set -euo pipefail
          order=$(curl -fsS -X POST http://localhost:8080/api/orders \
            -H 'content-type: application/json' \
            -d '{"customerEmail":"ci@example.com","lines":[{"sku":"SKU-1","description":"Blue widget","quantity":2,"unitPrice":11.50}]}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["orderId"])')
          echo "order $order"

          for _ in $(seq 1 60); do
            status=$(curl -fsS "http://localhost:8080/api/orders/$order" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$status" = "Completed" ] && break
            sleep 1
          done
          [ "$status" = "Completed" ] || { echo "::error::order stuck in $status"; docker compose logs; exit 1; }

          curl -fsS -o receipt.pdf "http://localhost:8080/api/orders/$order/receipt"
          # The magic bytes. A 200 carrying an error page would otherwise pass.
          head -c 4 receipt.pdf | grep -q '%PDF' || { echo "::error::not a PDF"; exit 1; }
          echo "receipt is $(stat -c%s receipt.pdf) bytes of PDF"

      - name: Show the logs if anything failed
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
